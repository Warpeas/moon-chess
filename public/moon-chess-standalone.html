<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>月蚀棋 · 原版 / 原版+可移动</title>
<style>
  :root {
    --bg-0: #05041a;
    --bg-1: #0d0a30;
    --panel: #120e38;
    --panel-2: #1c1652;
    --line: rgba(190,170,255,.22);
    --text: #f3eeff;
    --sub: #a9a1d8;
    --p1: #ffd9ee;       /* 粉白 */
    --p1-glow: #ff78c8;
    --p2: #7a71ff;       /* 紫蓝 */
    --p2-glow: #8cc6ff;
    --accent: #ff5577;
    --ok: #51e898;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0;padding:0;min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:radial-gradient(1200px 800px at 50% -10%, #2a2470 0%, #110d3a 45%, var(--bg-0) 80%);
  }
  .stars{position:fixed;inset:0;pointer-events:none;opacity:.6;z-index:0;
    background:
      radial-gradient(1px 1px at 10% 20%, #fff 99%, transparent),
      radial-gradient(1px 1px at 30% 80%, #fff 99%, transparent),
      radial-gradient(1.5px 1.5px at 60% 40%, #d9cfff 99%, transparent),
      radial-gradient(1px 1px at 80% 10%, #fff 99%, transparent),
      radial-gradient(1px 1px at 70% 75%, #fff 99%, transparent),
      radial-gradient(1.5px 1.5px at 20% 55%, #c8b6ff 99%, transparent),
      radial-gradient(1px 1px at 50% 15%, #fff 99%, transparent),
      radial-gradient(1px 1px at 90% 60%, #d9cfff 99%, transparent);
    background-size:500px 500px;
    animation:drift 180s linear infinite;
  }
  @keyframes drift { to{ transform:translate(-200px,-120px); } }
  .wrap { position:relative; z-index:1; max-width:520px; margin:0 auto; padding:18px 16px 40px; }
  h1{font-size:20px;margin:0 0 4px;letter-spacing:2px;text-align:center}
  .sub{color:var(--sub);font-size:13px;text-align:center;margin-bottom:14px}
  .card{background:linear-gradient(180deg,rgba(28,22,82,.85),rgba(18,14,56,.85));
    border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;
    box-shadow:0 10px 26px rgba(0,0,0,.35)}
  .grp-title{font-size:13px;color:var(--sub);margin:2px 0 8px;letter-spacing:.5px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
  .opt{
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    border-radius:10px;padding:10px 8px;font-size:13px;cursor:pointer;transition:all .15s ease;text-align:center;
  }
  .opt:hover{transform:translateY(-1px)}
  .opt.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,85,119,.18);
    background:linear-gradient(180deg,rgba(255,85,119,.14),var(--panel-2))}
  .opt .t{font-weight:700}
  .opt .d{color:var(--sub);font-size:11px;margin-top:3px;line-height:1.4}
  .btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,#ff7a97,#e53f66);cursor:pointer;
    box-shadow:0 6px 16px rgba(229,63,102,.25);width:100%;font-size:15px}
  .btn.ghost{background:transparent;color:var(--sub);box-shadow:none;border:1px solid var(--line)}
  .row{display:flex;gap:8px}

  .game-wrap{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
  .turn{font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
  .turn .gem{width:18px;height:18px;border-radius:50%}
  .turn.g1 .gem{background:radial-gradient(circle at 30% 30%, #fff 0%, var(--p1) 55%, var(--p1-glow) 100%);box-shadow:0 0 8px rgba(255,120,200,.55)}
  .turn.g2 .gem{background:radial-gradient(circle at 30% 30%, #d6f1ff 0%, var(--p2) 55%, var(--p2-glow) 100%);box-shadow:0 0 8px rgba(122,113,255,.55)}
  .info{display:flex;gap:8px;color:var(--sub);font-size:12px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
  .actions{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
  .actions .spacer{flex:1}
  .tab{min-width:84px;border-radius:10px;padding:8px 10px;font-size:13px;text-align:center;color:var(--sub);
    background:var(--panel);border:1px solid var(--line);cursor:pointer}
  .tab.active{color:#fff;border-color:var(--accent);background:linear-gradient(180deg,rgba(255,85,119,.16),var(--panel))}
  .tab.lg{font-weight:700}
  .hint{font-size:12px;color:var(--sub);margin-bottom:8px;min-height:16px}
  .counts{display:flex;gap:12px;margin-bottom:8px}
  .count{display:inline-flex;align-items:center;gap:6px;font-size:13px}
  .count .dot{width:12px;height:12px;border-radius:50%}
  .count.p1 .dot{background:var(--p1);box-shadow:0 0 6px var(--p1-glow)}
  .count.p2 .dot{background:var(--p2);box-shadow:0 0 6px var(--p2-glow)}

  .board{
    width:100%;max-width:420px;margin:0 auto;aspect-ratio:1/1;
    background:linear-gradient(135deg,#161145 0%,#1e1856 100%);
    border:1px solid var(--line);
    border-radius:16px;padding:10px;
    display:grid;gap:8px;
    box-shadow:inset 0 0 30px rgba(0,0,0,.4),0 14px 30px rgba(0,0,0,.4)
  }
  .cell{position:relative;border-radius:12px;
    background:linear-gradient(180deg,#271f63,#1c1650);
    border:1px solid rgba(160,145,240,.22);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .15s ease;user-select:none}
  .cell.place-hint::after{content:'';position:absolute;inset:26%;border-radius:50%;border:2px dashed rgba(255,255,255,.14)}
  .cell.move-hint::after{content:'';position:absolute;inset:18%;border-radius:10px;border:2px dashed rgba(122,220,170,.55);background:rgba(81,232,152,.07)}
  .cell.selected{box-shadow:0 0 0 2px #51e898,0 0 18px rgba(81,232,152,.25)}
  .cell.disabled{cursor:not-allowed}
  .cell.win{box-shadow:0 0 0 2px rgba(255,215,0,.85),0 0 22px rgba(255,215,0,.3)}
  .piece{width:70%;height:70%;border-radius:50%;position:relative;z-index:1;
    animation:dropIn 300ms cubic-bezier(.3,1.6,.6,1)}
  @keyframes dropIn{from{transform:translateY(-8px) scale(.6);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .piece.p1{background:radial-gradient(circle at 30% 30%,#fff 0%,var(--p1) 60%,var(--p1-glow) 100%);box-shadow:0 6px 14px rgba(0,0,0,.45),0 0 12px rgba(255,120,200,.45)}
  .piece.p2{background:radial-gradient(circle at 30% 30%,#e5f2ff 0%,var(--p2) 60%,var(--p2-glow) 100%);box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 12px rgba(140,198,255,.45)}
  /* 己方回合己方最早子闪烁：不消失，只有警告式闪烁 */
  .cell.oldest .piece{animation:blinkOld 1.1s steps(2,end) infinite}
  @keyframes blinkOld{0%,50%{opacity:.22;filter:saturate(.5)}50.01%,100%{opacity:1;filter:saturate(1.1)}}
  /* 即将被移除的那颗：放新子/移动后先做淡出动画再真删除 */
  .cell.vanishing .piece{animation:vanishOut 520ms ease both}
  @keyframes vanishOut{0%{transform:scale(1);opacity:1}70%{transform:scale(.25);opacity:.25}100%{transform:scale(0);opacity:0}}
  /* 棋子滑动移动动画:以 --dx/--dy (unit cell) 位移；JS在渲染瞬间写变量 */
  .piece.sliding{animation:slideMove 320ms cubic-bezier(.25,1.4,.5,1) both}
  @keyframes slideMove{
    from{transform:translate(calc(var(--dx,0) * -100%),calc(var(--dy,0) * -100%));opacity:.5}
    to{transform:translate(0,0);opacity:1}
  }

  .banner{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);display:none;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .banner.show{display:flex}
  .banner .msg{font-weight:700}
  .banner .btns{display:flex;gap:6px}
  .banner button{border:0;padding:8px 12px;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;font-size:13px;
    background:linear-gradient(180deg,#7a6bff,#4e40d0)}
  .banner button.minor{background:var(--panel-2);color:var(--sub);border:1px solid var(--line)}

  .legend{font-size:12px;color:var(--sub);line-height:1.7}
  .legend b{color:var(--text)}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(122,113,255,.18);
    border:1px solid rgba(122,113,255,.35);color:#c9c3ff;font-size:11px;margin-left:6px}
  .tag.a{background:rgba(81,232,152,.14);color:#9df3c7;border-color:rgba(81,232,152,.3)}
  .tag.b{background:rgba(255,120,200,.14);color:#ffc8e7;border-color:rgba(255,120,200,.3)}

  @media (max-width:380px){ .opts{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">

  <!-- Setup -->
  <div id="setup">
    <h1 id="setupTitle">🌙 月蚀棋 <span class="tag a" id="modeTag">A 原版</span></h1>
    <div class="sub" id="modeSub">3×3 棋盘 · 先连 3 子胜 · 每方最多同时 3 颗</div>

    <div class="card">
      <div class="grp-title">难度</div>
      <div class="opts" id="diffOpts">
        <div class="opt active" data-v="easy"><div class="t">简单</div><div class="d">AI 放水，易赢</div></div>
        <div class="opt" data-v="normal"><div class="t">标准</div><div class="d">堵截 + 抢先</div></div>
        <div class="opt" data-v="hard"><div class="t">困难</div><div class="d">Minimax 3–4 层</div></div>
      </div>
    </div>

    <div class="card">
      <div class="grp-title">执棋方（P1 粉白先手）</div>
      <div class="opts" id="sideOpts">
        <div class="opt active" data-v="1"><div class="t">执粉白（先手）</div><div class="d">P1</div></div>
        <div class="opt" data-v="2"><div class="t">执紫蓝（后手）</div><div class="d">P2</div></div>
      </div>
    </div>

    <button class="btn" id="btnStart">▶ 开始对局</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="btnBack">← 返回模式选择</button>

    <div style="height:20px"></div>
    <div class="legend card" id="legend"></div>
  </div>

  <!-- Game -->
  <div id="game" class="game-wrap">
    <div class="topbar">
      <div class="turn g1" id="turnLabel"><span class="gem"></span><span id="turnText">P1 粉白</span></div>
      <div class="info">
        <div class="chip" id="ruleChip">规则：先连 3 子胜 · 每方上限 3 颗</div>
        <div class="chip" id="turnChip">回合 0</div>
      </div>
    </div>

    <div class="counts">
      <div class="count p1"><span class="dot"></span><span id="p1Count">0</span> 粉白 <span id="p1Warn" style="color:#ffd580;font-size:11px;display:none">⚠ 最早子闪烁</span></div>
      <div class="count p2"><span class="dot"></span><span id="p2Count">0</span> 紫蓝 <span id="p2Warn" style="color:#ffd580;font-size:11px;display:none">⚠ 最早子闪烁</span></div>
    </div>

    <div class="actions">
      <div class="tab active lg" id="modeLabel">A 原版</div>
      <div class="tab" id="btnMoveToggle" style="display:none">🧭 移动: 4 邻</div>
      <div class="spacer"></div>
      <div class="tab" id="btnRematch">🔄 重开</div>
      <div class="tab" id="btnExit">↩️ 改设定</div>
    </div>

    <div class="hint" id="hint">点空格放子</div>
    <div class="board" id="board"></div>

    <div class="banner" id="endBanner">
      <div class="msg" id="endMsg">结束</div>
      <div class="btns">
        <button class="minor" id="btnBannerExit">改设定</button>
        <button id="btnBannerRestart">再来一局</button>
      </div>
    </div>

    <div style="height:14px"></div>
    <div class="legend card" id="gameLegend"></div>
  </div>
</div>

<script>
(() => {
'use strict';

// ===== Query params =====
const QP = new URLSearchParams(location.search);
const MODE = (QP.get('m') === 'movable') ? 'movable' : 'yuanshen'; // default yuanshen
const MOVE_K = 4; // 原版+可移动:固定 4 邻
const SIZE = 3;   // 原版: 3x3
const P1 = 1, P2 = 2;
const MAX_PER_SIDE = 3;

// ===== DOM refs =====
const $ = id => document.getElementById(id);
$('modeTag').textContent = (MODE === 'movable' ? 'B 原版 + 可移动' : 'A 原版');
$('modeTag').className = 'tag ' + (MODE === 'movable' ? 'b' : 'a');
$('modeLabel').textContent = (MODE === 'movable' ? 'B 原版 + 可移动' : 'A 原版');
if (MODE === 'movable') { $('btnMoveToggle').style.display = ''; $('btnMoveToggle').textContent = '🧭 移动: 4 邻'; }

const RULE_TEXT = MODE === 'movable'
  ? '<b>B · 原版 + 可移动：</b>3×3 棋盘，<b>先连成 3 子者胜</b>。每方<b>最多同时 3 颗</b>：<b>轮到己方</b>时，<b>己方最早子只闪烁不消失</b>；<b>完成一次操作（放子或移动）</b>后，若己方已有 3 颗，则<b>己方最早子消失</b>。<b>移动：</b>点击己方棋子→点 4 邻空格（绿色目标）移动一格，移动也算一次操作。'
  : '<b>A · 原神原版月亮棋：</b>3×3 棋盘，<b>先连成 3 子者胜</b>。每方<b>最多同时 3 颗</b>：<b>轮到己方</b>时，<b>己方最早子只闪烁不消失</b>；<b>放新子后</b>若己方已有 3 颗，则<b>己方最早子消失</b>。无移动操作。';
$('legend').innerHTML = RULE_TEXT;
$('gameLegend').innerHTML = RULE_TEXT;

// ===== Setup UI =====
function optPicker(id){
  const root = $(id);
  const opts = root.querySelectorAll('.opt');
  opts.forEach(o=>o.addEventListener('click',()=>{
    opts.forEach(x=>x.classList.remove('active'));
    o.classList.add('active');
  }));
}
optPicker('diffOpts'); optPicker('sideOpts');
function activeVal(id){ return document.querySelector('#'+id+' .opt.active').dataset.v; }

$('btnStart').addEventListener('click', () => {
  const diff = activeVal('diffOpts');
  const me = parseInt(activeVal('sideOpts'),10);
  cfg = { diff, me };
  $('ruleChip').textContent = MODE==='movable'
    ? `原版+可移动 · 3×3 · 连3胜 · 每方≤3 · 4邻移动`
    : `原版 · 3×3 · 连3胜 · 每方≤3 · 己方回合最早子闪`;
  $('setup').style.display='none';
  $('game').style.display='block';
  startGame();
});
$('btnBack').addEventListener('click', ()=>{ location.href='index.html'; });

// ===== State =====
let cfg = null;
let game = null;
let movingSel = null;   // {r,c} or null
let aiThinking = false;
let aiTimer = null;
let visualVanish = null; // {r,c,timer}
let slideInfo = null;     // {toR,toC,fromR,fromC}  for slide animation on piece at target

// ===== Core game =====
function newGame(){
  return {
    board: Array.from({length:SIZE},()=>Array(SIZE).fill(0)),
    // 队列：每方按本方落子先后
    queue: { 1: [], 2: [] },  // item: {r,c,bornStep,uid}
    current: P1,
    status: 'playing',
    winner: 0,
    winLine: null,
    stepN: 0,
    vanishQueued: null,  // {r,c,player} — 本步操作后需消失的子（淡出动画前先从逻辑上移除但画面保留）
    uidC: 0,
  };
}
function inB(r,c){return r>=0&&r<SIZE&&c>=0&&c<SIZE;}
function moveNeighbors4(r,c){
  const out=[]; const d=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const [dr,dc] of d){ const nr=r+dr,nc=c+dc; if(inB(nr,nc)&&game.board[nr][nc]===0) out.push([nr,nc]); }
  return out;
}
function isLegalMoveStep(fr,fc,tr,tc){
  const dr=tr-fr, dc=tc-fc;
  if(dr===0 && dc===0) return false;
  return Math.abs(dr)+Math.abs(dc)===1;
}
function findUidInQueue(player, uid){
  const q = game.queue[player];
  for(let i=0;i<q.length;i++) if(q[i].uid===uid) return i;
  return -1;
}
function findCellInQueue(player, r, c){
  const q = game.queue[player];
  for(let i=0;i<q.length;i++) if(q[i].r===r&&q[i].c===c) return i;
  return -1;
}
// LINES for 3x3 win
const LINES = [
  [[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]],
  [[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]],
  [[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]],
];
function checkWinLine(board, player){
  for(const line of LINES){
    if(line.every(([r,c])=>board[r][c]===player)) return line;
  }
  return null;
}
function countPieces(){
  let a=0,b=0;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){ const v=game.board[r][c]; if(v===P1)a++; else if(v===P2)b++; }
  return {p1:a,p2:b};
}

// 返回：当前己方如果又执行一次新操作（放或移）会导致哪颗旧子消失？
// — 己方队列已有 ≥ MAX_PER_SIDE(3) 时，才会消失最早那颗。
// — 闪烁规则：轮到己方回合开始，只要己方满 3 颗，己方最早子就闪烁。
function oldestOf(player){
  const q=game.queue[player];
  return q.length>0 ? q[0] : null;
}
function pieceHasMoves(r,c,player){
  if(game.board[r][c]!==player) return false;
  return moveNeighbors4(r,c).length>0;
}

// place: 空格放子; 更新本方队列; 如果己方队列>3，则最早那颗从逻辑上移除（但画面先做vanish动画）；再判胜负；再切回合
// 注意：消失时序=「放/移完后己方已满则己方最早消失」。我们不直接从board移除，而是先在queue标记并把vanishQueued记录，在动画完成时再逻辑移除 + 胜负重判。
// 简化:先直接移除逻辑但把视觉vanish做成幽灵。
function doPlace(r,c,player){
  if(game.status!=='playing') return {ok:false};
  if(player!==game.current) return {ok:false};
  if(!inB(r,c)||game.board[r][c]!==0) return {ok:false};
  game.board[r][c]=player;
  game.stepN++;
  const uid = ++game.uidC;
  game.queue[player].push({r,c,bornStep:game.stepN,uid});

  // 胜负先判：连三赢优先。
  let winner=0, winLine=null;
  winLine = checkWinLine(game.board, player);
  if(winLine){ winner = player; }

  // 己方满 3 -> 己方最早子"放新子后消失"。
  let vanished = null;
  if(!winner && game.queue[player].length > MAX_PER_SIDE){
    const old = game.queue[player].shift();
    vanished = { r:old.r, c:old.c, player };
    game.board[old.r][old.c]=0;
  }

  // 再次判胜负（vanish后可能连三被破坏或新增）
  if(winner){
    finishGame(winner, winLine);
  } else {
    // 若vanish后对方还有机会但当前回合切到对方；对方没动作就继续。
    game.current = player===P1?P2:P1;
    // 如果棋盘满且无法移动(模式A)：判和
    if(isDeadDraw(player)){
      finishGame(0, null, '棋盘无空间且无合法移动');
    }
  }
  return {ok:true, vanished, winner, winLine};
}

// move: 己方棋子 4 邻移动到空格。移动也算"一次操作"，同样触发：己方若满3 -> 最早子消失。
// 新位置bornStep/uid：视为"新子"——因为它等价于一次新操作。即：移动后该移动的棋子成为队列最新。
function doMove(fr,fc,tr,tc,player){
  if(game.status!=='playing') return {ok:false};
  if(player!==game.current) return {ok:false};
  if(!inB(fr,fc)||!inB(tr,tc)) return {ok:false};
  if(game.board[fr][fc]!==player||game.board[tr][tc]!==0) return {ok:false};
  if(!isLegalMoveStep(fr,fc,tr,tc)) return {ok:false};

  game.board[fr][fc]=0;
  game.board[tr][tc]=player;
  game.stepN++;

  // 把原棋子从本方队列移除，并作为新子重入队尾（成为最新）。
  const qi = findCellInQueue(player, fr, fc);
  if(qi>=0) game.queue[player].splice(qi,1);
  const uid = ++game.uidC;
  game.queue[player].push({r:tr,c:tc,bornStep:game.stepN,uid});

  let winner=0, winLine=null;
  winLine = checkWinLine(game.board, player);
  if(winLine){ winner = player; }

  let vanished = null;
  if(!winner && game.queue[player].length > MAX_PER_SIDE){
    const old = game.queue[player].shift();
    vanished = { r:old.r, c:old.c, player };
    game.board[old.r][old.c]=0;
  }
  if(winner){
    finishGame(winner, winLine);
  } else {
    game.current = player===P1?P2:P1;
    if(isDeadDraw(player)){
      finishGame(0, null, '棋盘无空间且无合法移动');
    }
  }
  return {ok:true, fromR:fr,fromC:fc,toR:tr,toC:tc, vanished, winner, winLine};
}

function isDeadDraw(lastPlayer){
  // 模式A: 所有空格满；模式B: 所有空格满 AND 当前方所有己方棋子没有可移动邻格
  let empty=0;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(game.board[r][c]===0) empty++;
  if(empty>0) return false;
  if(MODE==='yuanshen') return true;
  // movable模式：当前方是否有至少一个可移动
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(game.board[r][c]===game.current && pieceHasMoves(r,c,game.current)) return false;
  }
  return true;
}

function finishGame(winner, line, reason){
  game.status='over';
  game.winner=winner;
  game.winLine=line || null;
  game.endReason = reason || null;
}

// ===== Rendering =====
const boardEl = $('board');
function buildBoardDOM(){
  boardEl.innerHTML='';
  boardEl.style.gridTemplateColumns=`repeat(${SIZE},1fr)`;
  boardEl.style.gridTemplateRows=`repeat(${SIZE},1fr)`;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const d=document.createElement('div'); d.className='cell';
    d.dataset.r=r; d.dataset.c=c;
    d.addEventListener('click', onCellClick);
    boardEl.appendChild(d);
  }
}
function cellAt(r,c){ return boardEl.children[r*SIZE+c]; }

function render(extra={}){
  const {p1,p2} = countPieces();
  $('p1Count').textContent=p1; $('p2Count').textContent=p2;
  const turnLabel=$('turnLabel');
  turnLabel.classList.remove('g1','g2');
  turnLabel.classList.add(game.current===P1?'g1':'g2');
  const me = cfg.me;
  const curText = game.current===P1
    ? (me===P1?'你的回合 (粉白)':'AI 思考中 (粉白)')
    : (me===P2?'你的回合 (紫蓝)':'AI 思考中 (紫蓝)');
  $('turnText').textContent = curText;
  $('turnChip').textContent = `回合 ${game.stepN}`;

  // warning badges (side warn)
  const w1 = (game.status==='playing' && game.current===P1 && game.queue[P1].length>=MAX_PER_SIDE);
  const w2 = (game.status==='playing' && game.current===P2 && game.queue[P2].length>=MAX_PER_SIDE);
  $('p1Warn').style.display = w1? 'inline-block':'none';
  $('p2Warn').style.display = w2? 'inline-block':'none';

  // Hint sets
  let placeSet = null, moveDestSet = null;
  if(!aiThinking && game.status==='playing' && game.current===me){
    placeSet = new Set();
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(game.board[r][c]===0) placeSet.add(r+','+c);
    if(movingSel){
      moveDestSet = new Set();
      for(const [nr,nc] of moveNeighbors4(movingSel.r,movingSel.c)) moveDestSet.add(nr+','+nc);
    }
  }

  // 警告闪烁：轮到己方 + 己方≥3颗 → 己方最早. piece.oldest
  const oldestP1 = oldestOf(P1);
  const oldestP2 = oldestOf(P2);
  const oldestKeyP1 = w1 && oldestP1 ? oldestP1.r+','+oldestP1.c : '';
  const oldestKeyP2 = w2 && oldestP2 ? oldestP2.r+','+oldestP2.c : '';

  // winSet
  const winSet = new Set();
  if(game.winLine) for(const [r,c] of game.winLine) winSet.add(r+','+c);

  // vanish visual ghost: vanished cell stays drawn while fading. We rely on visualVanish timer and render extra.
  // slide: mark piece at target with sliding style
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const el = cellAt(r,c);
    const v = game.board[r][c];
    const key = v===0?'0':('p'+v);
    if(el.dataset._k!==key){
      el.innerHTML='';
      if(v!==0){
        const p=document.createElement('div');
        p.className='piece '+(v===P1?'p1':'p2');
        // slide animation: if this cell is the target of a recent move
        if(slideInfo && slideInfo.toR===r && slideInfo.toC===c){
          const dx = (slideInfo.toC - slideInfo.fromC); // cell units (positive = right)
          const dy = (slideInfo.toR - slideInfo.fromR);
          p.style.setProperty('--dx', (dx).toFixed(1));
          p.style.setProperty('--dy', (dy).toFixed(1));
          p.classList.add('sliding');
          // 动画完成后移除 sliding 类（避免下次渲染再播）
          setTimeout(()=>{ p.classList.remove('sliding'); p.style.removeProperty('--dx'); p.style.removeProperty('--dy'); }, 360);
        }
        el.appendChild(p);
      }
      el.dataset._k=key;
    }
    el.classList.remove('place-hint','move-hint','selected','oldest','vanishing','disabled','win');
    if(winSet.has(r+','+c)) el.classList.add('win');
    // 警告闪烁: oldest(己方)且轮到己方且己方>=3颗
    const k=r+','+c;
    if(oldestKeyP1 && k===oldestKeyP1) el.classList.add('oldest');
    if(oldestKeyP2 && k===oldestKeyP2) el.classList.add('oldest');

    // vanishing ghost: board has cleared it, but we still overlay a visual piece? Simpler: 直接把 cell 标记 vanishing 并临时填子
    if(visualVanish && visualVanish.r===r && visualVanish.c===c && v===0){
      // 逻辑已空。为做淡出动画，我们临时把 piece 补回来并加 vanishing
      if(!el.querySelector('.piece')){
        const p=document.createElement('div');
        p.className='piece '+(visualVanish.player===P1?'p1':'p2');
        el.appendChild(p);
      }
      el.classList.add('vanishing');
    }

    if(!aiThinking && game.status==='playing' && game.current===me){
      if(movingSel && movingSel.r===r && movingSel.c===c) el.classList.add('selected');
      if(moveDestSet && moveDestSet.has(k)) el.classList.add('move-hint');
      else if(MODE!=='movable' && !movingSel && v===0 && placeSet && placeSet.has(k)) el.classList.add('place-hint');
      else if(MODE==='movable' && v===0 && placeSet && placeSet.has(k)) el.classList.add('place-hint'); // movable也全空格提示
    } else {
      el.classList.add('disabled');
    }
  }

  // End banner
  const banner = $('endBanner');
  if(game.status==='over'){
    let msg;
    const w = game.winner;
    if(w===0) msg = `平局 · ${game.endReason||'无合法动作'}`;
    else if(w===cfg.me) msg = `🎉 你赢了 · 连 3 子胜利`;
    else msg = `AI 获胜 · 连 3 子胜利`;
    $('endMsg').textContent = msg;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }

  // Hint
  const hint=$('hint');
  if(game.status!=='playing') hint.textContent='对局结束';
  else if(aiThinking) hint.textContent='AI 思考中…';
  else if(game.current!==me) hint.textContent='等待对方…';
  else {
    const hasAnyPlace = placeSet && placeSet.size>0;
    const hasAnyMove = (MODE==='movable') && (()=>{
      for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(game.board[r][c]===me && pieceHasMoves(r,c,me)) return true;
      return false;
    })();
    if(!hasAnyPlace && !hasAnyMove) hint.textContent='⚠️ 本回合无动作，按平局结算';
    else if(MODE==='yuanshen'){
      hint.textContent = w1||w2
        ? '点空格放子；⚠️ 你方最早子闪烁中，放新子后它会消失'
        : '点空格放子（先连 3 子胜）';
    } else { // movable
      if(!movingSel) hint.textContent = w1||w2
        ? '点空格=放子；点己方棋子=选中并显示 4 邻可移动目标；⚠️ 最早子闪烁中，完成操作后消失'
        : '点空格=放子；点己方棋子=选中并显示 4 邻可移动目标';
      else hint.textContent = `已选 (${movingSel.r+1},${movingSel.c+1})：点绿色目标格移动；再点已选取消；点其它空格=取消选中并放子`;
    }
  }
}

// ===== Interactions =====
function onCellClick(e){
  if(game.status!=='playing'||aiThinking) return;
  if(game.current!==cfg.me) return;
  const r=+e.currentTarget.dataset.r, c=+e.currentTarget.dataset.c;
  const v = game.board[r][c];

  if(MODE==='yuanshen'){
    if(v!==0) return;
    performUserAction(()=>doPlace(r,c,cfg.me));
    return;
  }
  // movable
  if(v===0){
    // selected destination: move
    if(movingSel && isLegalMoveStep(movingSel.r,movingSel.c,r,c)){
      const fr=movingSel.r, fc=movingSel.c;
      movingSel=null;
      performUserAction(()=>doMove(fr,fc,r,c,cfg.me));
      return;
    }
    movingSel=null;
    performUserAction(()=>doPlace(r,c,cfg.me));
    return;
  }
  if(v===cfg.me){
    if(movingSel && movingSel.r===r && movingSel.c===c){ movingSel=null; render(); return; }
    if(!pieceHasMoves(r,c,cfg.me)){ flashHint('这颗棋没 4 邻空格可动'); movingSel=null; render(); return; }
    movingSel={r,c}; render(); return;
  }
  // enemy: cancel
  if(movingSel){ movingSel=null; render(); }
}

function flashHint(t){ $('hint').textContent = t; }

function performUserAction(fn){
  slideInfo = null;
  const res = fn();
  if(!res || !res.ok){ flashHint('无法执行这一步'); return; }
  // If move, set slide animation
  if(res.fromR!==undefined && res.toR!==undefined){
    slideInfo = { fromR:res.fromR, fromC:res.fromC, toR:res.toR, toC:res.toC };
  }
  // schedule vanishing visual
  scheduleVanishVisual(res.vanished);
  render();
  // After visual vanish completes and status still playing → schedule AI
  if(game.status==='over') return;
  if(game.current!==cfg.me) scheduleAI();
}

function scheduleVanishVisual(v){
  // 清理上一个未完成的
  if(visualVanish && visualVanish.timer){ clearTimeout(visualVanish.timer); }
  visualVanish = null;
  if(!v) return;
  visualVanish = { r:v.r, c:v.c, player:v.player, timer:null };
  render();
  const t = setTimeout(()=>{
    visualVanish = null;
    render();
  }, 560);
  visualVanish.timer = t;
}

// ===== AI =====
// 动作类型: place 或 move(B模式)
function listAllActions(player){
  const acts=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(game.board[r][c]===0){
    acts.push({kind:'place',r,c});
  }
  if(MODE==='movable'){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(game.board[r][c]===player){
      for(const [nr,nc] of moveNeighbors4(r,c)){
        acts.push({kind:'move',fromR:r,fromC:c,r:nr,c:nc});
      }
    }
  }
  return acts;
}
function applyAction(a,player){
  if(a.kind==='place') return doPlaceNoSideEffects(a.r,a.c,player);
  else return doMoveNoSideEffects(a.fromR,a.fromC,a.r,a.c,player);
}
// 纯逻辑版（不触发game.status/finishGame，返回终局评估）
function doPlaceNoSideEffects(r,c,player){
  if(game.board[r][c]!==0) return null;
  game.board[r][c]=player;
  game.stepN++;
  const uid=++game.uidC;
  game.queue[player].push({r,c,bornStep:game.stepN,uid});
  let winLine = checkWinLine(game.board, player);
  let winner = winLine? player : 0;
  let vanished=null;
  if(!winner && game.queue[player].length>MAX_PER_SIDE){
    const old = game.queue[player].shift();
    vanished={r:old.r,c:old.c,player:old.player||player};
    game.board[old.r][old.c]=0;
    // 消失后可能破坏对方连三,也可能自己不再连三(但消失是自己的)
    if(winLine){
      const nl = checkWinLine(game.board, player);
      if(!nl){ winner=0; winLine=null; }
    }
  }
  game.current = player===P1?P2:P1;
  return {winner, winLine, vanished};
}
function doMoveNoSideEffects(fr,fc,tr,tc,player){
  if(game.board[fr][fc]!==player || game.board[tr][tc]!==0) return null;
  if(!isLegalMoveStep(fr,fc,tr,tc)) return null;
  game.board[fr][fc]=0; game.board[tr][tc]=player;
  game.stepN++;
  const qi = findCellInQueue(player,fr,fc);
  if(qi>=0) game.queue[player].splice(qi,1);
  const uid=++game.uidC;
  game.queue[player].push({r:tr,c:tc,bornStep:game.stepN,uid});
  let winLine=checkWinLine(game.board,player);
  let winner=winLine? player:0;
  let vanished=null;
  if(!winner && game.queue[player].length>MAX_PER_SIDE){
    const old=game.queue[player].shift();
    vanished={r:old.r,c:old.c,player};
    game.board[old.r][old.c]=0;
    if(winLine){
      const nl=checkWinLine(game.board,player);
      if(!nl){winner=0;winLine=null;}
    }
  }
  game.current = player===P1?P2:P1;
  return {winner, winLine, vanished};
}
function snapshot(){
  return {
    board: game.board.map(r=>r.slice()),
    queue: {1: game.queue[1].map(x=>({...x})), 2: game.queue[2].map(x=>({...x}))},
    current: game.current, stepN: game.stepN, uidC: game.uidC,
  };
}
function restore(s){
  game.board=s.board.map(r=>r.slice());
  game.queue={1:s.queue[1].map(x=>({...x})),2:s.queue[2].map(x=>({...x}))};
  game.current=s.current; game.stepN=s.stepN; game.uidC=s.uidC;
}

// AI评分 + Minimax
const HEU_WIN = 1e6;
function evaluate(aiPlayer){
  // win status first
  const me=aiPlayer, op = aiPlayer===P1?P2:P1;
  // 对board简单评估: 连2+空位 + 威胁 + 中心位置分 + 队列长度(接近上限则减分，优先避免自己被消失)
  let s=0;
  for(const line of LINES){
    let meC=0, opC=0; let blanks=[];
    for(const [r,c] of line){
      const v=game.board[r][c];
      if(v===me) meC++; else if(v===op) opC++; else blanks.push([r,c]);
    }
    if(meC===3) return HEU_WIN;
    if(opC===3) return -HEU_WIN;
    if(meC===2 && blanks.length===1) s += 500;
    else if(meC===1 && blanks.length===2) s += 20;
    if(opC===2 && blanks.length===1) s -= 800;
    else if(opC===1 && blanks.length===2) s -= 15;
  }
  // center: (1,1) bonus
  if(game.board[1][1]===me) s+=6; else if(game.board[1][1]===op) s-=6;
  // corners
  for(const [r,c] of [[0,0],[0,2],[2,0],[2,2]]){
    if(game.board[r][c]===me) s+=3; else if(game.board[r][c]===op) s-=3;
  }
  // vanish risk: 如果当前队列为3且轮到对方操作(下一个是对方操作)，则对方会让我们更早消失；不重要
  return s;
}

function minimax(depth, aiPlayer, alpha, beta){
  if(depth===0) return evaluate(aiPlayer);
  const me = aiPlayer;
  const op = me===P1?P2:P1;
  const player = game.current; // whose turn in the simulation
  const acts = listAllActions(player);
  // 动作顺序优化：先看连3赢/堵连3
  acts.sort((a,b)=> actionHeuristic(b,player,aiPlayer) - actionHeuristic(a,player,aiPlayer));
  if(player===aiPlayer){ // max
    let best=-Infinity;
    for(const a of acts){
      const sn=snapshot();
      const r=applyAction(a,player);
      if(!r){restore(sn);continue;}
      let v;
      if(r.winner===aiPlayer) v = HEU_WIN + depth;
      else if(r.winner!==0) v = -HEU_WIN - depth;
      else v=minimax(depth-1,aiPlayer,alpha,beta);
      restore(sn);
      best=Math.max(best,v); alpha=Math.max(alpha,best);
      if(beta<=alpha) break;
    }
    return best;
  } else { // min
    let best=Infinity;
    for(const a of acts){
      const sn=snapshot();
      const r=applyAction(a,player);
      if(!r){restore(sn);continue;}
      let v;
      if(r.winner===aiPlayer) v = HEU_WIN + depth;
      else if(r.winner!==0) v = -HEU_WIN - depth;
      else v=minimax(depth-1,aiPlayer,alpha,beta);
      restore(sn);
      best=Math.min(best,v); beta=Math.min(beta,best);
      if(beta<=alpha) break;
    }
    return best;
  }
}
function actionHeuristic(a,player,aiPlayer){
  // quick: simulate 1 step, evaluate without recursion. Higher = better for current player
  const sn=snapshot();
  const r=applyAction(a,player);
  let score=0;
  if(r){
    if(r.winner===player) score=1e9;
    else if(r.winner!==0) score=-1e9;
    else score = (player===aiPlayer)? evaluate(aiPlayer) : -evaluate(aiPlayer===P1?P2:P1);
  }
  restore(sn);
  return score + Math.random()*0.01;
}

function aiChoice(diff, aiPlayer){
  const acts = listAllActions(aiPlayer);
  if(acts.length===0) return null;
  // quick immediate win
  for(const a of acts){
    const sn=snapshot();
    const r=applyAction(a,aiPlayer);
    const ok = r && r.winner===aiPlayer;
    restore(sn);
    if(ok) return a;
  }
  // block opponent
  const opPlayer = aiPlayer===P1?P2:P1;
  let blockMove = null, blockScore = -1;
  for(const a of acts){
    // simulate opponent would have winning move without our interference; simpler: if we don't pick this, is any op move winning? we actually want to check each op winning move and see if our move blocks that empty cell
  }
  // Compute all opponent winning lines that have 2-in-a-row + blank target
  const blocks = new Set();
  for(const line of LINES){
    let opC=0; let blank=null;
    for(const [r,c] of line){
      const v=game.board[r][c];
      if(v===opPlayer) opC++;
      else if(v===0) blank=[r,c];
    }
    if(opC===2 && blank) blocks.add(blank[0]+','+blank[1]);
  }
  // easy: random 60%
  if(diff==='easy'){
    if(Math.random()<0.35){
      const blocker = acts.filter(a=>(a.kind==='place'?blocks.has(a.r+','+a.c):blocks.has(a.r+','+a.c)));
      if(blocker.length) return blocker[Math.floor(Math.random()*blocker.length)];
    }
    return acts[Math.floor(Math.random()*acts.length)];
  }
  const depth = diff==='hard' ? 4 : 2;
  // sort by heuristic then minimax top N
  acts.sort((a,b)=> actionHeuristic(b,aiPlayer,aiPlayer) - actionHeuristic(a,aiPlayer,aiPlayer));
  const cand = acts.slice(0, Math.min(8, acts.length));
  let best = cand[0], bestScore = -Infinity;
  for(const a of cand){
    const sn=snapshot();
    const r=applyAction(a,aiPlayer);
    let v;
    if(!r){restore(sn);continue;}
    if(r.winner===aiPlayer) v = HEU_WIN + 999;
    else if(r.winner!==0) v = -HEU_WIN - 999;
    else v = minimax(depth-1, aiPlayer, -Infinity, Infinity);
    restore(sn);
    v += Math.random()*0.4;
    if(v>bestScore){bestScore=v; best=a;}
  }
  return best;
}

function scheduleAI(){
  if(game.status!=='playing') return;
  aiThinking=true;
  render();
  const wait = cfg.diff==='easy'? 400+Math.random()*400 : cfg.diff==='hard'? 700+Math.random()*700 : 500+Math.random()*500;
  aiTimer = setTimeout(runAI, wait);
}
function runAI(){
  if(game.status!=='playing'){ aiThinking=false; render(); return; }
  const aiPlayer = cfg.me===P1?P2:P1;
  const action = aiChoice(cfg.diff, aiPlayer);
  aiThinking=false;
  if(!action){
    // no moves, settle as draw
    if(game.status==='playing') finishGame(0,null,'AI 无动作');
    render(); return;
  }
  // execute same performUserAction flow (slide / vanish visuals)
  slideInfo = null;
  let res;
  if(action.kind==='place') res = doPlace(action.r, action.c, aiPlayer);
  else res = doMove(action.fromR, action.fromC, action.r, action.c, aiPlayer);
  if(res && res.ok){
    if(res.fromR!==undefined && res.toR!==undefined) slideInfo={fromR:res.fromR,fromC:res.fromC,toR:res.toR,toC:res.toC};
    scheduleVanishVisual(res.vanished);
  }
  render();
  if(game.status==='over') return;
  if(game.current!==cfg.me) scheduleAI();
}

// ===== Buttons =====
$('btnRematch').addEventListener('click', ()=>{ startGame(); });
$('btnBannerRestart').addEventListener('click', ()=>{ startGame(); });
$('btnExit').addEventListener('click', backToSetup);
$('btnBannerExit').addEventListener('click', backToSetup);
function backToSetup(){
  clearTimeout(aiTimer); aiThinking=false;
  if(visualVanish && visualVanish.timer) clearTimeout(visualVanish.timer);
  visualVanish=null; slideInfo=null; movingSel=null;
  $('game').style.display='none';
  $('setup').style.display='block';
}
function startGame(){
  game = newGame();
  movingSel=null; aiThinking=false;
  clearTimeout(aiTimer);
  visualVanish=null; slideInfo=null;
  buildBoardDOM();
  render();
  if(game.current!==cfg.me) scheduleAI();
}

})();
</script>
