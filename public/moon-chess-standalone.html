<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1b2a" />
  <title>Moon Chess · 月蚀棋</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22%237b2cbf%22/><circle cx=%2235%22 cy=%2235%22 r=%2222%22 fill=%22%230d1b2a%22/></svg>" />
  <style>
/* ============ 基础样式 ============ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg-0: #04060f;
  --bg-1: #0a0f22;
  --bg-2: #101a3a;
  --accent: #9d4edd;
  --accent-2: #7b2cbf;
  --accent-3: #c77dff;
  --cool-blue: #4cc9f0;
  --soft-blue: #4895ef;
  --text: #e8ecff;
  --text-dim: #aab3d6;
  --board-line: rgba(200, 220, 255, 0.28);
  --cell-hi: rgba(200, 220, 255, 0.12);
  --shadow: 0 10px 40px rgba(0,0,0,0.55);
  --radius: 16px;
}

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: radial-gradient(ellipse at top, #1b1040 0%, var(--bg-1) 35%, var(--bg-0) 100%);
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* 核心规则：.page 必须有 .show 才显示 */
#menu.page,
#game.page { display: none; }
#menu.page.show,
#game.page.show { display: flex; }

/* room-info 控制 */
#room-info { display: none; }
#room-info.show { display: flex; }

/* rematch-bar 默认隐藏（display:none 仅由 .show 规则切换为 flex） */
.rematch-bar { display: none; }
.rematch-bar.show {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* 强制重开按钮默认隐藏 */
#btn-force-restart { display: none; }
#btn-force-restart.show { display: inline-flex; }

/* ============ 星空背景 ============ */
.stars {
  position: fixed; inset: 0;
  background:
    radial-gradient(1px 1px at 20% 30%, #fff 99%, transparent),
    radial-gradient(1px 1px at 80% 10%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 50% 60%, #fff 99%, transparent),
    radial-gradient(1px 1px at 30% 80%, #fff 99%, transparent),
    radial-gradient(2px 2px at 70% 40%, #c8b6ff 99%, transparent),
    radial-gradient(1px 1px at 10% 70%, #c8b6ff 99%, transparent),
    radial-gradient(1px 1px at 90% 85%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 60% 20%, #fff 99%, transparent),
    radial-gradient(1px 1px at 40% 50%, #fff 99%, transparent),
    radial-gradient(1px 1px at 15% 15%, #c8b6ff 99%, transparent);
  background-size: 400px 400px;
  opacity: 0.7;
  animation: starDrift 120s linear infinite;
  pointer-events: none;
  z-index: 0;
}
.stars2 {
  background-size: 550px 550px;
  opacity: 0.4;
  animation-duration: 200s;
  animation-direction: reverse;
}
@keyframes starDrift {
  0% { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-200px,-100px,0); }
}

/* 飘浮的荧光装饰 */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #7b2cbf, transparent 70%);
  top: -150px; left: -150px;
  animation: floatA 14s ease-in-out infinite;
}
body::after {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #4cc9f0, transparent 70%);
  bottom: -120px; right: -120px;
  animation: floatB 16s ease-in-out infinite;
}
@keyframes floatA {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(80px, 60px) scale(1.15); }
}
@keyframes floatB {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-60px,-50px) scale(1.1); }
}

/* ============ 顶栏 ============ */
.top-bar {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px;
  gap: 12px;
}
.brand {
  display: flex; align-items: center; gap: 8px;
  font-weight: 600;
}
.brand .logo {
  font-size: 22px;
  color: var(--accent-3);
  filter: drop-shadow(0 0 6px var(--accent-3));
  animation: twinkle 2.5s ease-in-out infinite;
}
@keyframes twinkle {
  0%,100% { opacity: 1; filter: drop-shadow(0 0 6px var(--accent-3)); }
  50% { opacity: 0.5; filter: drop-shadow(0 0 12px var(--accent-3)); }
}
.brand .title {
  font-size: 18px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, var(--accent-3), var(--cool-blue));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.room-meta {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  font-size: 12px;
}
.room-code-wrap b { color: var(--accent-3); letter-spacing: 3px; font-weight: 700; }
.room-link {
  color: var(--cool-blue);
  text-decoration: none;
  max-width: 180px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.room-link:hover { text-decoration: underline; }

/* ============ 主菜单 ============ */
.page {
  position: relative; z-index: 5;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 16px;
}

.hero {
  text-align: center;
  max-width: 480px;
  padding: 20px;
}
.big-gem {
  width: 140px; height: 140px;
  margin: 0 auto 16px;
  animation: gemRotate 12s linear infinite;
  filter: drop-shadow(0 0 30px rgba(157,78,221,0.6));
}
@keyframes gemRotate {
  0% { transform: rotate(-6deg); }
  50% { transform: rotate(6deg); }
  100% { transform: rotate(-6deg); }
}
.big-gem svg { width: 100%; height: 100%; }

.hero h1 {
  margin: 0; font-size: 42px; letter-spacing: 6px;
  background: linear-gradient(135deg, #fff 0%, var(--accent-3) 40%, var(--cool-blue) 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  text-shadow: 0 0 40px rgba(157,78,221,0.3);
}
.subtitle {
  margin: 6px 0 14px;
  color: var(--text-dim);
  letter-spacing: 3px;
  font-size: 13px;
}
.rules-hint {
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.7;
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius);
  backdrop-filter: blur(8px);
}
.rules-hint b { color: var(--accent-3); }

.menu-buttons {
  display: flex; flex-direction: column; gap: 12px;
  margin-top: 28px; width: 100%; max-width: 320px;
}

.footer {
  margin-top: 24px;
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 2px;
  opacity: 0.7;
}

/* ============ 按钮 ============ */
.btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  padding: 14px 22px;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  font-size: 15px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: transform 0.15s, background 0.2s, box-shadow 0.2s, border-color 0.2s;
  backdrop-filter: blur(10px);
  font-family: inherit;
}
.btn:hover {
  background: rgba(255,255,255,0.12);
  transform: translateY(-2px);
  border-color: rgba(199,125,255,0.5);
}
.btn:active { transform: translateY(0); }
.btn.primary {
  background: linear-gradient(135deg, var(--accent-2), var(--accent-3));
  border-color: transparent;
  color: white;
  box-shadow: 0 6px 24px rgba(123,44,191,0.45);
}
.btn.primary:hover {
  box-shadow: 0 10px 32px rgba(123,44,191,0.6);
}
.btn.btn-ghost {
  background: transparent;
  border-color: rgba(255,255,255,0.15);
  color: var(--text-dim);
}
.btn.btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.06); }
.btn.btn-small { padding: 8px 14px; font-size: 13px; }
.btn-small {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 5px 10px; font-size: 11px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  color: var(--text-dim);
  cursor: pointer;
  font-family: inherit;
}
.btn-small:hover { color: var(--text); }

.btn-icon { font-size: 18px; }

/* ============ 对局页面 ============ */
.game-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 20px;
  width: 100%;
  max-width: 520px;
}

.game-header {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px;
}

.turn-indicator {
  font-size: 16px; letter-spacing: 1px;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
}
.turn-indicator.white { color: #ffe6f3; text-shadow: 0 0 8px rgba(255,155,210,0.72); }
.turn-indicator.black { color: #d7cdff; text-shadow: 0 0 8px rgba(150,130,255,0.68); }
/* 兼容保留 p1/p2 */
.turn-indicator.p1 { color: #ffe6f3; text-shadow: 0 0 8px rgba(255,155,210,0.72); }
.turn-indicator.p2 { color: #d7cdff; text-shadow: 0 0 8px rgba(150,130,255,0.68); }

.game-actions { display: flex; gap: 8px; }

/* 棋盘容器 */
.board-wrap {
  display: flex; justify-content: center; align-items: center;
  position: relative;
}

.board {
  position: relative;
  width: min(82vw, 520px);
  height: min(82vw, 520px);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 2px;
  padding: 10px;
  border-radius: 24px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
    radial-gradient(circle at center, rgba(157,78,221,0.18), transparent 70%);
  border: 1px solid rgba(200,220,255,0.15);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 30px 80px rgba(0,0,0,0.6),
    0 0 60px rgba(76,201,240,0.08),
    0 0 80px rgba(157,78,221,0.12);
  backdrop-filter: blur(12px);
}

/* 棋盘背景魔法线 */
.grid-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 24px;
  background:
    linear-gradient(to right, transparent calc(33.33% - 0.5px), var(--board-line) calc(33.33%), var(--board-line) calc(33.33% + 0.5px), transparent calc(33.33% + 1px)),
    linear-gradient(to right, transparent calc(66.66% - 0.5px), var(--board-line) calc(66.66%), var(--board-line) calc(66.66% + 0.5px), transparent calc(66.66% + 1px)),
    linear-gradient(to bottom, transparent calc(33.33% - 0.5px), var(--board-line) calc(33.33%), var(--board-line) calc(33.33% + 0.5px), transparent calc(33.33% + 1px)),
    linear-gradient(to bottom, transparent calc(66.66% - 0.5px), var(--board-line) calc(66.66%), var(--board-line) calc(66.66% + 0.5px), transparent calc(66.66% + 1px));
  animation: linePulse 4s ease-in-out infinite;
}
@keyframes linePulse {
  0%,100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* 单元格 */
.cell {
  position: relative;
  border-radius: 14px;
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.cell:hover:not(:has(.piece)) {
  background: var(--cell-hi);
}
.cell.win .piece {
  animation: winGlow 0.9s ease-in-out infinite;
}
@keyframes winGlow {
  0%,100% { filter: brightness(1.1); }
  50% { filter: brightness(1.6) drop-shadow(0 0 18px #fff); transform: scale(1.08); }
}

/* 游戏结束/对方思考时：整个棋盘点击禁用且降低可交互感 */
.board.disabled .cell { cursor: not-allowed; pointer-events: none; }
.board.disabled::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: rgba(4,6,15,0.18);
  pointer-events: none;
  z-index: 2;
}

/* AI 下子预览（思考时，AI 计划落子的空格显示半透明虚子） */
.cell .preview-move {
  position: absolute;
  inset: 14%;
  border-radius: 14px;
  opacity: 0.45;
  animation: previewPulse 1.4s ease-in-out infinite;
  pointer-events: none;
}
.cell .preview-move.p2::before {
  content: '';
  position: absolute;
  inset: 15%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.7) 0%, rgba(200,182,255,0.8) 35%, rgba(123,44,191,0.55) 70%, rgba(36,0,70,0.25) 100%);
  box-shadow: 0 0 14px rgba(76,201,240,0.35), 0 0 24px rgba(157,78,221,0.35);
}
.cell .preview-move.p1::before {
  content: '';
  position: absolute;
  inset: 15%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.7) 0%, rgba(255,216,240,0.85) 35%, rgba(199,125,255,0.6) 70%, rgba(90,24,154,0.28) 100%);
  box-shadow: 0 0 14px rgba(255,120,220,0.4), 0 0 24px rgba(157,78,221,0.35);
}
@keyframes previewPulse {
  0%,100% { opacity: 0.28; transform: scale(0.92); }
  50% { opacity: 0.58; transform: scale(1.02); }
}

/* 上一手落点（玩家/AI 刚落子的地方做一个彩色光圈留存，直到下一步发生） */
.cell.last-move::before {
  content: '';
  position: absolute;
  inset: 10%;
  border-radius: 16px;
  box-shadow:
    inset 0 0 0 2px rgba(76,201,240,0.55),
    0 0 14px rgba(76,201,240,0.35);
  pointer-events: none;
  animation: lastMoveGlow 1.8s ease-in-out infinite;
}
@keyframes lastMoveGlow {
  0%,100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* 「即将消失的棋子」更强烈的警示：棋子 + 单元格都高亮（玩家能一眼看出这步一落就哪颗会被吃掉） */
.cell.marked-to-remove {
  background: radial-gradient(circle at center, rgba(255, 80, 120, 0.30), rgba(255, 80, 120, 0.02) 65%);
}
.cell.marked-to-remove::after {
  content: '';
  position: absolute;
  inset: 6%;
  border-radius: 14px;
  border: 2px dashed rgba(255, 90, 130, 0.9);
  box-shadow: 0 0 18px rgba(255, 90, 130, 0.65) inset, 0 0 24px rgba(255, 90, 130, 0.35);
  pointer-events: none;
  animation: markedRemoveBlink 1.2s ease-in-out infinite;
}
@keyframes markedRemoveBlink {
  0%,100% { opacity: 0.65; }
  50% { opacity: 1; }
}

/* 结束结果 banner（替代旧的 result-overlay 大弹窗）：顶部贴在棋盘正上方，渐变大字 + 次按钮 */
.end-banner {
  width: 100%;
  max-width: 520px;
  margin: 4px auto 10px;
  padding: 14px 18px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(157,78,221,0.45), rgba(36,0,70,0.75));
  border: 1px solid rgba(200,220,255,0.18);
  box-shadow: 0 0 22px rgba(157,78,221,0.4);
  display: none;
  align-items: center; justify-content: space-between;
  gap: 12px;
  color: var(--text);
}
.end-banner.show { display: flex; }
.end-banner .end-title {
  font-size: 18px;
  letter-spacing: 2px;
  font-weight: 700;
}
.end-banner .end-title.win  { color: #ffd5ff; text-shadow: 0 0 10px rgba(255,120,220,0.8); }
.end-banner .end-title.lose { color: #bcd8ff; text-shadow: 0 0 10px rgba(76,201,240,0.7); }
.end-banner .end-title.draw { color: var(--text-dim); }
.end-banner .end-actions { display: flex; gap: 8px; }

/* 确认弹窗（单机重开确认） */
.confirm-mask .confirm-actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
.confirm-title { font-size: 18px; letter-spacing: 2px; margin-bottom: 6px; }
.confirm-desc { color: var(--text-dim); font-size: 13px; line-height: 1.6; }
.confirm-desc:empty { display: none; }

/* 思考标签（在 turn-indicator 右侧补一小点动态） */
.turn-indicator .thinking-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 999px;
  background: currentColor;
  margin: 0 0 2px 8px;
  vertical-align: middle;
  box-shadow: 0 0 10px currentColor;
  animation: dotBlink 1s steps(2,end) infinite;
}
@keyframes dotBlink { 50% { opacity: 0.15; } }

/* 棋子 */
.piece {
  width: 72%; height: 72%;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: opacity 0.25s;
}
.piece .gem {
  width: 100%; height: 100%;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
}
.piece.p1 .gem { animation: pulseP1 2.2s ease-in-out infinite; }
.piece.p2 .gem { animation: pulseP2 2.4s ease-in-out infinite; }

/* P1 = 先手 · 粉白棋：粉+青紫脉冲辉光 */
@keyframes pulseP1 {
  0%,100% { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.55)) drop-shadow(0 0 6px rgba(255,150,210,0.45)); }
  50% { filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5)) drop-shadow(0 0 18px rgba(198,150,255,0.78)); }
}
/* P2 = 后手 · 紫蓝棋：蓝紫渐变呼吸光晕 */
@keyframes pulseP2 {
  0%,100% { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 5px rgba(110,92,255,0.45)); }
  50% { filter: drop-shadow(0 8px 20px rgba(0,0,0,0.7)) drop-shadow(0 0 14px rgba(90,150,255,0.82)); }
}

/* ========== AI 思考候选红圈（2-3 个位置循环切换高亮） ========== */
.cell .think-candidate {
  position: absolute;
  inset: 20%;
  border-radius: 50%;
  border: 2px solid rgba(255, 70, 90, 0.35);
  pointer-events: none;
  transition: all 0.25s ease;
}
.cell .think-candidate.dim {
  opacity: 0.28;
  transform: scale(0.82);
  border-color: rgba(255, 70, 90, 0.28);
}
.cell .think-candidate.active {
  opacity: 1;
  transform: scale(1.02);
  border-color: rgba(255, 70, 90, 0.9);
  box-shadow:
    0 0 14px rgba(255, 70, 90, 0.5),
    inset 0 0 10px rgba(255, 70, 90, 0.28);
  animation: candidatePulse 0.9s ease-in-out infinite;
}
@keyframes candidatePulse {
  0%,100% { transform: scale(1.02); opacity: 0.9; }
  50%     { transform: scale(1.12); opacity: 1;   }
}

/* 落子动效 */
.piece.drop {
  animation: dropIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes dropIn {
  0% { transform: scale(0.2) translateY(-12px); opacity: 0; }
  60% { transform: scale(1.15) translateY(2px); opacity: 1; }
  100% { transform: scale(1) translateY(0); }
}

/* 消失预告闪烁（棋子自身的动画；结合单元格.marked-to-remove 让用户一眼看见） */
.piece.fading {
  animation: fadeBlink 1.2s ease-in-out infinite;
  filter: drop-shadow(0 0 14px rgba(255, 80, 130, 0.75));
}
@keyframes fadeBlink {
  0%, 100% { opacity: 1; transform: scale(1); }
  30% { opacity: 0.35; transform: scale(0.85); }
  60% { opacity: 1; transform: scale(1); }
  75% { opacity: 0.6; }
}

/* ============ 重开投票条 ============ */
.rematch-bar {
  width: 100%; max-width: 480px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  backdrop-filter: blur(8px);
  /* display / justify-content / align-items 由 .show 规则控制（见顶部），避免覆盖 display:none */
}
.rematch-info { color: var(--text-dim); font-size: 13px; letter-spacing: 1px; }
.rematch-buttons { display: flex; gap: 8px; }

/* ============ 模态框 ============ */
.modal-mask {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  background: rgba(4,6,15,0.75);
  backdrop-filter: blur(8px);
  z-index: 50;

  <script>
// AI 算法 —— 井字棋 + 消失规则
// 棋盘值: 0 空, 1 先手(玩家), 2 后手(AI 默认)
// pieces: { 1: [{row,col},...], 2: [{row,col},...] }  FIFO 队列

function cloneBoard(board) {
  return board.map((r) => r.slice());
}

function clonePieces(pieces) {
  return {
    1: pieces[1].map((p) => ({ ...p })),
    2: pieces[2].map((p) => ({ ...p })),
  };
}

function checkWin(board) {
  const lines = [
    [[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]],
    [[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]],
    [[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]],
  ];
  for (const line of lines) {
    const [a,b,c] = line;
    const v = board[a[0]][a[1]];
    if (v !== 0 && v === board[b[0]][b[1]] && v === board[c[0]][c[1]]) return v;
  }
  return 0;
}

// 模拟一次落子，返回新的 { board, pieces, winner }
function simulate(board, pieces, row, col, player) {
  const nb = cloneBoard(board);
  const np = clonePieces(pieces);
  // ✅ 先移除该方最早的棋子（如果已有 3 颗）
  if (np[player].length >= 3) {
    const old = np[player].shift();
    nb[old.row][old.col] = 0;
  }
  nb[row][col] = player;
  np[player].push({ row, col });
  return { board: nb, pieces: np, winner: checkWin(nb) };
}

function availableMoves(board) {
  const moves = [];
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 3; c++)
      if (board[r][c] === 0) moves.push({ row: r, col: c });
  return moves;
}

// ========== 难度 1: 简单 ==========
// 随机落子，但优先看是否能直接赢或必须堵对方
function aiEasy(board, pieces, aiPlayer) {
  const human = aiPlayer === 1 ? 2 : 1;
  const moves = availableMoves(board);

  // 先找能赢的
  for (const m of moves) {
    const res = simulate(board, pieces, m.row, m.col, aiPlayer);
    if (res.winner === aiPlayer) return m;
  }
  // 再找必须堵的
  for (const m of moves) {
    const res = simulate(board, pieces, m.row, m.col, human);
    if (res.winner === human) return m;
  }
  // 随机
  return moves[Math.floor(Math.random() * moves.length)];
}

// ========== 难度 2: 正常 ==========
// 带 2 步前瞻的 minimax，考虑消失机制
function aiNormal(board, pieces, aiPlayer) {
  const human = aiPlayer === 1 ? 2 : 1;
  const moves = availableMoves(board);
  if (moves.length === 0) return null;

  // 立即赢
  for (const m of moves) {
    const res = simulate(board, pieces, m.row, m.col, aiPlayer);
    if (res.winner === aiPlayer) return m;
  }
  // 堵对手立即赢
  for (const m of moves) {
    const res = simulate(board, pieces, m.row, m.col, human);
    if (res.winner === human) return m;
  }

  // 2 层前瞻打分
  let best = moves[0];
  let bestScore = -Infinity;

  for (const m of moves) {
    const after = simulate(board, pieces, m.row, m.col, aiPlayer);
    if (after.winner === aiPlayer) return m;

    // 对手最好回应
    let worst = -Infinity;
    const enemyMoves = availableMoves(after.board);
    for (const em of enemyMoves) {
      const eAfter = simulate(after.board, after.pieces, em.row, em.col, human);
      if (eAfter.winner === human) { worst = 100; break; }
      if (eAfter.winner === aiPlayer) { worst = -100; continue; }
      worst = Math.max(worst, 0); // 未知局面简化为 0
    }
    const score = -worst;
    if (score > bestScore) { bestScore = score; best = m; }
  }
  return best;
}

// ========== 难度 3: 困难 ==========
// 完整 minimax + alpha-beta 剪枝，深度 5
function aiHard(board, pieces, aiPlayer, depth = 5) {
  const human = aiPlayer === 1 ? 2 : 1;
  const MAX_DEPTH = depth;

  function evaluate(b) {
    // 给局面打分: 看双方未来能形成的威胁
    const win = checkWin(b);
    if (win === aiPlayer) return 10000;
    if (win === human) return -10000;
    // 简单启发：中心 +2，角落 +1
    let score = 0;
    const center = b[1][1];
    if (center === aiPlayer) score += 3;
    if (center === human) score -= 3;
    const corners = [[0,0],[0,2],[2,0],[2,2]];
    for (const [r,c] of corners) {
      if (b[r][c] === aiPlayer) score += 1;
      if (b[r][c] === human) score -= 1;
    }
    return score;
  }

  function minimax(b, pcs, player, d, alpha, beta) {
    const win = checkWin(b);
    if (win !== 0) return win === aiPlayer ? 10000 - (MAX_DEPTH - d) : -10000 + (MAX_DEPTH - d);
    if (d === 0) return evaluate(b);

    const moves = availableMoves(b);
    if (moves.length === 0) return evaluate(b);

    if (player === aiPlayer) {
      let best = -Infinity;
      for (const m of moves) {
        const after = simulate(b, pcs, m.row, m.col, player);
        const v = minimax(after.board, after.pieces, human, d - 1, alpha, beta);
        best = Math.max(best, v);
        alpha = Math.max(alpha, v);
        if (beta <= alpha) break;
      }
      return best;
    } else {
      let best = Infinity;
      for (const m of moves) {
        const after = simulate(b, pcs, m.row, m.col, player);
        const v = minimax(after.board, after.pieces, aiPlayer, d - 1, alpha, beta);
        best = Math.min(best, v);
        beta = Math.min(beta, v);
        if (beta <= alpha) break;
      }
      return best;
    }
  }

  // 先看立即赢
  const currentMoves = availableMoves(board);
  for (const m of currentMoves) {
    const after = simulate(board, pieces, m.row, m.col, aiPlayer);
    if (after.winner === aiPlayer) return m;
  }
  // 堵立即输
  for (const m of currentMoves) {
    const after = simulate(board, pieces, m.row, m.col, human);
    if (after.winner === human) return m;
  }

  let bestMove = currentMoves[0];
  let bestScore = -Infinity;
  // 加一点随机性避免完全可预测
  const candidates = currentMoves.sort(() => Math.random() - 0.5).slice(0, Math.min(5, currentMoves.length));

  for (const m of candidates) {
    const after = simulate(board, pieces, m.row, m.col, aiPlayer);
    const score = minimax(after.board, after.pieces, human, MAX_DEPTH - 1, -Infinity, Infinity);
    if (score > bestScore) { bestScore = score; bestMove = m; }
  }
  return bestMove;
}

function aiMove(board, pieces, aiPlayer, difficulty) {
  if (difficulty === 'easy') return aiEasy(board, pieces, aiPlayer);
  if (difficulty === 'normal') return aiNormal(board, pieces, aiPlayer);
  return aiHard(board, pieces, aiPlayer);
}

window.AI = { aiMove };

  <script>
// ======== 客户端游戏核心 ========
// P1 = WHITE 先手（白方），P2 = BLACK 后手（黑方）
const WHITE = 1;
const BLACK = 2;
const P1 = WHITE;
const P2 = BLACK;

function sideOf(player) { return player === WHITE ? 'white' : 'black'; }
function sideLabel(side) { return side === 'white' ? '白方' : '黑方'; }
function mySideLabel(playerSide) {
  return playerSide === 'white' ? '你执白（先手）' : '你执黑（后手）';
}

class LocalGame {
  constructor() {
    this.reset();
  }
  reset() {
    this.board = Array.from({ length: 3 }, () => Array(3).fill(0));
    this.current = P1;
    this.pieces = { 1: [], 2: [] };
    this.status = 'playing';
    this.winner = 0;
    this.winLine = null;
    this.pendingRemove = null;
  }
  place(row, col, player) {
    if (this.status !== 'playing') return { ok: false };
    if (player !== this.current) return { ok: false };
    if (this.board[row][col] !== 0) return { ok: false };

    let removed = null;
    if (this.pieces[player].length >= 3) {
      const old = this.pieces[player].shift();
      this.board[old.row][old.col] = 0;
      removed = old;
    }
    this.board[row][col] = player;
    this.pieces[player].push({ row, col });

    const win = this._checkWin(this.board);
    if (win.winner !== 0) {
      this.status = 'ended';
      this.winner = win.winner;
      this.winLine = win.line;
      this.pendingRemove = null;
      return { ok: true, removed, winner: win.winner, winLine: win.line, pendingRemove: null, current: 0 };
    }

    const next = this.current === P1 ? P2 : P1;
    this.current = next;
    // ✅ pendingRemove 必须基于「接下来要落子的人」计算（而非上一手玩家）
    // 轮到 B 走，如果 B 已经有 3 颗，则提示 B 自己最早那颗下次会消失
    if (this.pieces[next].length >= 3) {
      const oldest = this.pieces[next][0];
      this.pendingRemove = { player: next, row: oldest.row, col: oldest.col };
    } else {
      this.pendingRemove = null;
    }
    return { ok: true, removed, winner: 0, winLine: null, pendingRemove: this.pendingRemove, current: this.current };
  }
  _checkWin(board) {
    const lines = [
      [[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]],
      [[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]],
      [[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]],
    ];
    for (const line of lines) {
      const [a,b,c] = line;
      const v = board[a[0]][a[1]];
      if (v !== 0 && v === board[b[0]][b[1]] && v === board[c[0]][c[1]]) return { winner: v, line };
    }
    return { winner: 0, line: null };
  }
  snapshot() {
    return {
      board: this.board.map((r) => r.slice()),
      current: this.current,
      status: this.status,
      winner: this.winner,
      winLine: this.winLine,
      pendingRemove: this.pendingRemove,
      pieces: { 1: this.pieces[1].map(p => ({...p})), 2: this.pieces[2].map(p => ({...p})) }
    };
  }
}

// ======== 应用控制器 ========

const App = {
  // 模式: menu | local | online

  // rematch: { status: 'none'|'pending'|'accepted'|'rejected', guestResponse: null|true|false }
  rematch: { status: 'none', byHost: false, guestResponse: null },

  // AI 调度：延迟时间 & 思考候选红圈（2-3 个位置循环切换）
  aiTimer: null,
  aiCandidatesTimer: null,

  // ==================== 初始化 ====================
  init() {

    // 通用确认对话框（单机重开确认等）

  },

  _onDiffPicked(difficulty) {

  backToDifficultyFromSide() {

  // ==================== 通用工具 ====================
  showConfirm({ title, desc, onYes }) {

  onConfirmYes() {

  hideRematchBar() {
    const bar = safeGet('rematch-bar');

  },
  showRematchBar() {

  },

  // ==================== 菜单切换 ====================
  showMenu() {

    this.clearAiTimer(true);
    this.aiCandidates = [];
    this.stopAiCandidateCycle();
    safeGet('menu')?.classList.add('show');
    safeGet('game')?.classList.remove('show');
    safeGet('room-info')?.classList.remove('show');
    safeGet('difficulty-select')?.classList.remove('show');
    safeGet('side-select')?.classList.remove('show');
    const dlg = safeGet('result-overlay'); if (dlg) dlg.classList.remove('show');
    this.hideRematchBar();
    this.hideEndBanner();
    this.rematch = { status: 'none', byHost: false, guestResponse: null };
    this.setBoardDisabled(false);
  },

  showDifficultySelect() {
    safeGet('difficulty-select')?.classList.add('show');
  },
  showSideSelect() {
    safeGet('side-select')?.classList.add('show');
  },
  hideJoinDialog() {
    safeGet('join-dialog')?.classList.remove('show');
  },
  showJoinDialog() {
    // 静态分享版本：提示用户需要部署联机服务端
    if (window.MOON_CHESS_STANDALONE && typeof window.__moon_chess_showOnlineTip === 'function') {
      window.__moon_chess_showOnlineTip();
      return;
    }
    safeGet('join-dialog')?.classList.add('show');
    const inp = safeGet('join-input');
    inp.value = '';
    setTimeout(() => inp.focus(), 50);
  },

  startLocal(difficulty, side) {
    this.difficulty = difficulty;
    this.playerSide = side || 'white';
    const humanPlayer = (this.playerSide === 'white') ? WHITE : BLACK;
    const aiPlayer    = (this.playerSide === 'white') ? BLACK : WHITE;
    this.mode = 'local';
    this.local = new LocalGame();
    this.state = this.local.snapshot();
    this.clearAiTimer(true);
    this.aiCandidates = [];
    this.stopAiCandidateCycle();
    this.rematch = { status: 'none', byHost: false, guestResponse: null };
    safeGet('menu')?.classList.remove('show');
    safeGet('difficulty-select')?.classList.remove('show');
    safeGet('side-select')?.classList.remove('show');
    safeGet('game')?.classList.add('show');
    safeGet('room-info')?.classList.remove('show');
    this.hideDialogs();
    this.hideRematchBar();
    this.hideEndBanner();
    this.setBoardDisabled(false);
    this.updateRestartButton();
    this.render();

    // 如果玩家选执黑（AI 执白先手 = WHITE），则开局 AI 自动走
    if (this.state.status === 'playing' && this.state.current === aiPlayer) {
      this.scheduleAiMove(aiPlayer);
    }
  },

  hideDialogs() {
    safeGet('difficulty-select')?.classList.remove('show');
    safeGet('side-select')?.classList.remove('show');
    safeGet('join-dialog')?.classList.remove('show');
  },

  hideEndBanner() {
    const banner = safeGet('end-banner'); if (!banner) return;
    banner.classList.remove('show');
    banner.hidden = true;
  },
  showEndBanner(title, cls) {
    const banner = safeGet('end-banner'); if (!banner) return;
    // Banner 不再显示胜负文案（已经改由 turn-indicator 承担），
    // 但保留 class 接口兼容，title 可传空。
    const t = safeGet('end-title');
    t.textContent = '';   // 不写"AI获胜"那一行
    t.classList.remove('win','lose','draw');
    if (cls) t.classList.add(cls);
    banner.hidden = false;
    banner.classList.add('show');
  },

  setBoardDisabled(disabled) {
    const board = safeGet('board'); if (!board) return;
    board.classList.toggle('disabled', !!disabled);
  },

  clearAiTimer(alsoCancelPreview) {
    if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
  },
  stopAiCandidateCycle() {
    if (this.aiCandidatesTimer) { clearInterval(this.aiCandidatesTimer); this.aiCandidatesTimer = null; }
    this.aiCandidates = [];
    this.aiCandidatesActiveIdx = 0;
  },
  startAiCandidateCycle(boardArr, totalDelay) {
    // 从所有空格挑 2-3 个候选位置，循环切换红圈
    const empties = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) if (boardArr[r][c] === 0) empties.push([r, c]);
    if (empties.length === 0) return;
    // Fisher-Yates 取前 2-3 个
    for (let i = empties.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [empties[i], empties[j]] = [empties[j], empties[i]];
    }
    const n = Math.max(2, Math.min(3, empties.length));
    // 统一存储为字符串，便于 render 内的 indexOf 匹配
    this.aiCandidates = empties.slice(0, n).map(([r, c]) => `${r}-${c}`);
    this.aiCandidatesActiveIdx = 0;

    // 候选切换周期：使总周期大概轮换 3-6 次 depending on total delay
    const cyclePeriod = Math.max(240, Math.min(520, Math.floor(totalDelay / 6)));
    this.render();
    this.aiCandidatesTimer = setInterval(() => {
      this.aiCandidatesActiveIdx = (this.aiCandidatesActiveIdx + 1) % this.aiCandidates.length;
      this.render();
    }, cyclePeriod);
  },

  // ==================== 联机 ====================
  goOnline() {
    // 单机静态分享版本（moon-chess-standalone.html）：没有真实 WebSocket 服务
    if (window.MOON_CHESS_STANDALONE && typeof window.__moon_chess_showOnlineTip === 'function') {
      window.__moon_chess_showOnlineTip();
      return;
    }
    this.mode = 'online';
    this.playerSide = (this.mySeat === 1) ? 'white' : 'black';
    this.clearAiTimer(true);
    this.stopAiCandidateCycle();
    this.rematch = { status: 'none', byHost: false, guestResponse: null };
    this.hideEndBanner();
    if (!this.socket) {
      this.socket = io();
      this.setupSocket();
    }
    safeGet('menu')?.classList.remove('show');
    safeGet('game')?.classList.add('show');
    safeGet('room-info')?.classList.add('show');
    // 联机重开栏默认隐藏，仅当房主发起请求（status= pending/rejected）才显示
    this.hideRematchBar();
    this.updateRestartButton();

    if (this.roomCode) {
      this.socket.emit('room:join', { roomCode: this.roomCode });
    }
  },

  createRoom() {
    this.goOnline();
    if (this.socket) this.socket.emit('room:create');
  },

  setupSocket() {
    const s = this.socket;

    s.on('room:created', (data) => {
      this.roomCode = data.roomCode;
      this.mySeat = data.seat;
      this.roomPlayers = data.players;
      history.replaceState(null, '', `/r/${this.roomCode}`);
      this.updateRoomUI(data);
      this.state = data.game;
      this.rematch = { status: 'none', byHost: false, guestResponse: null };
      this.hideRematchBar();
      this.updateRestartButton();
      this.render();
    });

    s.on('room:joined', (data) => {
      this.roomCode = data.roomCode;
      this.mySeat = data.seat;
      this.roomPlayers = data.players;
      history.replaceState(null, '', `/r/${this.roomCode}`);
      this.updateRoomUI(data);
      this.state = data.game;
      this.rematch = { status: 'none', byHost: false, guestResponse: null };
      this.hideRematchBar();
      this.updateRestartButton();
      this.render();
    });

    s.on('room:update', (data) => {
      this.roomPlayers = data.players;
      if (data.game) this.state = data.game;
      this.updateRoomUI(data);
      this.updateRestartButton();
      this.render();
    });

    s.on('room:error', ({ message }) => {
      alert(message);
      this.exitToMenu();
    });

    s.on('room:playerLeft', () => {
      if (this.rematch.status === 'pending') {
        this.rematch.status = 'rejected';
        this.rematch.guestResponse = false;
      }
      this.updateRoomUI({});
      this.updateRestartButton();
      this.renderRematchBar();
    });

    s.on('game:update', (data) => {
      this.state = { ...this.state, ...data };
      if (data.current !== undefined) this.state.current = data.current;
      if (data.pendingRemove !== undefined) this.state.pendingRemove = data.pendingRemove;
      if (data.status !== undefined) this.state.status = data.status;
      if (data.winner !== undefined) this.state.winner = data.winner;
      if (data.winLine !== undefined) this.state.winLine = data.winLine;
      // 不再渲染 last-move 光圈（用户要求去掉蓝框）
      if (data.status === 'playing') {
        this.rematch = { status: 'none', byHost: false, guestResponse: null };
        this.hideRematchBar();
      }
      this.rebuildPiecesFromBoard();
      this.updateRestartButton();
      this.render();
    });

    s.on('game:rematchUpdate', (data) => {
      this.rematch.status = data.status || 'none';
      this.rematch.guestResponse = (data.guestResponse === undefined) ? null : data.guestResponse;
      this.rematch.byHost = (data.status === 'pending');
      this.updateRestartButton();
      this.renderRematchBar();
    });

    s.on('game:restarted', ({ game }) => {
      this.state = game;
      this.rebuildPiecesFromBoard();
      this.rematch = { status: 'none', byHost: false, guestResponse: null };
      this.hideEndBanner();
      this.hideRematchBar();
      this.setBoardDisabled(false);
      this.updateRestartButton();
      this.render();
    });

    s.on('game:error', ({ reason }) => {
      console.warn('game error:', reason);
    });
  },

  rebuildPiecesFromBoard() {
    if (!this.state) return;
    if (!this.state.pieces) {
      this.state.pieces = { 1: [], 2: [] };
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const v = this.state.board[r][c];
          if (v !== 0) this.state.pieces[v].push({ row: r, col: c });
        }
      }
    }
  },

  updateRoomUI(data) {
    const info = safeGet('room-info');
    if (!info) return;
    if (this.mode !== 'online') { info.classList.remove('show'); return; }
    info.classList.add('show');
    safeGet('room-code').textContent = this.roomCode || '--';
    const url = location.origin + '/r/' + (this.roomCode || '');
    const link = safeGet('room-link');
    link.textContent = url;
    link.href = url;

    const copyBtn = safeGet('btn-copy');
    copyBtn.onclick = () => {
      navigator.clipboard?.writeText(url).then(() => {
        copyBtn.textContent = '已复制 ✓';
        setTimeout(() => copyBtn.textContent = '复制', 1500);
      });
    };
  },

  // ==================== UI 状态：重开按钮/横幅 ====================
  updateRestartButton() {
    const btn = safeGet('btn-restart');
    const again = safeGet('btn-end-again');
    if (!btn) return;

    if (this.mode === 'local') {
      btn.textContent = '↻ 重开';
      btn.disabled = false;
      // 单机永远隐藏重开投票条
      this.hideRematchBar();
      // end-banner 的「再来一局」在单机始终是"再来一局"，不区分 pending 与否
      if (again) {
        again.textContent = '再来一局';
        again.disabled = false;
      }
      return;
    }

    if (this.mode !== 'online') return;

    const isHost = (this.mySeat === 1);
    if (isHost) {
      if (this.rematch.status === 'pending') {
        btn.textContent = '↻ 撤回重开';
        if (again) again.textContent = '撤回重开请求';
      } else {
        btn.textContent = '↻ 请求重开';
        if (again) again.textContent = '请求再来一局';
      }
      btn.disabled = false;
      if (again) again.disabled = false;
    } else {
      // 客人：不能主动发起
      btn.textContent = '↻ 等待房主';
      btn.disabled = true;
      // 客人的 end-banner 提供「再来一局」按钮没有意义，隐藏掉（客人用投票条同意/拒绝）
      if (again) again.style.display = 'none';
    }
  },

  // 联机重开栏渲染：仅 status !== none 才显示（none 时什么都不展示）
  renderRematchBar() {
    const bar  = safeGet('rematch-bar');
    const info = safeGet('rematch-info');
    const yes  = safeGet('btn-rematch-yes');
    const no   = safeGet('btn-rematch-no');
    if (!bar || !info || !yes || !no) return;

    if (this.mode !== 'online') {
      this.hideRematchBar();
      return;
    }

    const status = this.rematch.status;
    const isHost = (this.mySeat === 1);

    // 规则：联机也默认不显示，只在房主发起或有结果反馈时显示
    if (status === 'none') {
      this.hideRematchBar();
      return;
    }

    this.showRematchBar();

    if (status === 'pending') {
      if (isHost) {
        info.textContent = '已请求“再来一局”，等待对方同意…';
        yes.style.display = 'none';
        no.style.display  = '';
        no.textContent = '撤回';
        no.disabled = false;
        // 恢复默认 click（之前可能被重新发起覆盖）
        no.onclick = null;
        no.addEventListenerOnce ? null : null;
        // 重绑到默认（事件绑定在 init 中是全局的，这里不需要再重复）
      } else {
        info.textContent = '房主请求“再来一局”，请选择：';
        yes.style.display = '';
        no.style.display  = '';
        yes.textContent = '同意';
        no.textContent  = '拒绝';
        const responded = (this.rematch.guestResponse === true || this.rematch.guestResponse === false);
        yes.disabled = responded;
        no.disabled  = responded;
      }
    } else if (status === 'accepted') {
      info.textContent = '双方已同意，正在重开…';
      yes.style.display = 'none';
      no.style.display  = 'none';
    } else if (status === 'rejected') {
      const reason = (this.rematch.guestResponse === false) ? '对方已拒绝重开请求' : '重开请求已取消';
      info.textContent = reason;
      yes.style.display = 'none';
      if (isHost) {
        no.style.display = '';
        no.textContent = '重新发起';
        no.disabled = false;
        // 点"重新发起"等价于顶栏点"请求重开"
        no.onclick = (e) => { e.stopPropagation(); this.handleRestart(); };
      } else {
        no.style.display = 'none';
      }
    }
  },

  // ==================== 点击处理 ====================
  handleCellClick(row, col) {
    if (!this.state || this.state.status !== 'playing') return;

    if (this.mode === 'local') {
      const humanPlayer = (this.playerSide === 'white') ? WHITE : BLACK;
      const aiPlayer    = (this.playerSide === 'white') ? BLACK : WHITE;
      if (this.state.current !== humanPlayer) return;
      if (this.aiTimer) return;                    // AI 思考中，点不了
      if (this.local.board[row][col] !== 0) return;
      const res = this.local.place(row, col, humanPlayer);
      if (!res.ok) return;
      this.state = this.local.snapshot();
      this.updateRestartButton();
      this.render();

      // AI 自动下（候选红圈动画 + 慢速落子）—— 推迟到下一帧，保证首帧渲染就绪
      if (this.state.status === 'playing' && this.state.current === aiPlayer) {
        const aiRef = aiPlayer;
        setTimeout(() => this.scheduleAiMove(aiRef), 60);
      }
      return;
    }

    if (this.mode === 'online') {
      if (this.state.current !== this.mySeat) return;
      if (this.state.board[row][col] !== 0) return;
      this.socket.emit('game:place', { roomCode: this.roomCode, row, col, seat: this.mySeat });
    }
  },

  scheduleAiMove(aiPlayerNum) {
    this.clearAiTimer(false);
    this.stopAiCandidateCycle();
    this.setBoardDisabled(true);

    const base = { easy: 1600, normal: 1250, hard: 950 }[this.difficulty] || 1200;
    const jitter = Math.floor(Math.random() * 700);
    const totalDelay = base + jitter;
    // 在 ~45% 时间点真正计算 AI 最佳着；在此之前先跑 2-3 候选红圈动画
    const computeDelay = Math.floor(totalDelay * (0.4 + Math.random() * 0.15));
    const placeDelay   = totalDelay - computeDelay;

    // 启动 AI 候选红圈循环（2-3 个位置动画切换）
    this.startAiCandidateCycle(this.local.board, totalDelay);
    this.render();

    this.aiTimer = setTimeout(() => {
      const move = AI.aiMove(this.local.board, this.local.pieces, aiPlayerNum, this.difficulty);
      if (!move) {
        this.clearAiTimer(true);
        this.stopAiCandidateCycle();
        this.setBoardDisabled(false);
        this.render();
        return;
      }
      // 计算完之后仍保持红圈动画一小会（placeDelay）再落子
      this.aiTimer = setTimeout(() => {
        this.stopAiCandidateCycle();
        this.local.place(move.row, move.col, aiPlayerNum);
        this.aiTimer = null;
        this.state = this.local.snapshot();
        this.setBoardDisabled(false);
        this.updateRestartButton();
        this.render();
        const humanPlayer = (this.playerSide === 'white') ? WHITE : BLACK;
        // 如果玩家还没获胜/平局，且又轮到玩家，就不再触发 AI
        // 如果游戏结束则 banner 会显示；如果再继续轮到 AI（极端 case），手动触发：
        if (this.state.status === 'playing' && this.state.current !== humanPlayer) {
          this.scheduleAiMove(this.state.current);
        }
      }, placeDelay);
    }, computeDelay);
  },

  // 顶部重开 / 结束横幅「再来一局」共用
  handleRestart() {
    if (this.mode === 'local') {
      // 只要一个标题"再开一局"，去掉描述句子
      this.showConfirm({
        title: '再开一局',
        desc: '',
        onYes: () => {
          this.clearAiTimer(true);
          this.stopAiCandidateCycle();
          this.local.reset();
          this.state = this.local.snapshot();
          this.hideEndBanner();
          this.setBoardDisabled(false);
          this.updateRestartButton();
          this.render();
          // 玩家选执黑先手时，开局由 AI 执白先走
          const aiPlayer = (this.playerSide === 'white') ? BLACK : WHITE;
          if (this.state.status === 'playing' && this.state.current === aiPlayer) {
            this.scheduleAiMove(aiPlayer);
          }
        }
      });
      return;
    }

    if (this.mode !== 'online' || !this.socket) return;
    if (this.mySeat !== 1) return; // 客人无权主动发起
    // 发起或撤回（当前 pending 时点击等价于取消）
    const shouldCancel = (this.rematch.status === 'pending');
    this.socket.emit('game:rematch', { roomCode: this.roomCode, cancel: shouldCancel || undefined });
  },

  // 重开投票条按钮
  rematchAction(action) {
    if (this.mode !== 'online' || !this.socket) return;
    const isHost = (this.mySeat === 1);
    if (isHost) {
      if (action === 'cancel') {
        this.socket.emit('game:rematch', { roomCode: this.roomCode, cancel: true });
      }
    } else {
      const accept = (action === 'accept');
      this.socket.emit('game:rematchResponse', { roomCode: this.roomCode, accept });
    }
  },

  exitToMenu() {
    if (this.socket) {
      this.socket.disconnect();
      this.socket = null;
    }
    this.roomCode = null;
    this.clearAiTimer(true);
    this.stopAiCandidateCycle();
    history.replaceState(null, '', '/');
    this.showMenu();
  },

  voteRematch(vote) {
    // 兼容调用（废弃）
    this.rematchAction(vote ? 'accept' : 'cancel');
  },

  // ==================== 渲染 ====================
  render() {
    if (!this.state) return;

    const cells = document.querySelectorAll('.cell');
    cells.forEach((el) => {
      const row = parseInt(el.dataset.row, 10);
      const col = parseInt(el.dataset.col, 10);
      const v = this.state.board[row][col];
      el.className = 'cell';
      el.innerHTML = '';

      if (v !== 0) {
        const piece = document.createElement('div');
        // p1 = 粉白（先手），p2 = 紫蓝（后手）对应 CSS 颜色
        piece.className = 'piece p' + v;
        // 最早棋子闪烁：按 pendingRemove 精确标记棋子本体（不加单元格红框）
        const pr = this.state.pendingRemove;
        if (pr && pr.row === row && pr.col === col) {
          piece.classList.add('fading');
        }
        piece.classList.add('drop');
        requestAnimationFrame(() => piece.classList.remove('drop'));
        piece.innerHTML = this._gemSVG(v);
        el.appendChild(piece);
      } else {
        // 空格：AI 思考中，显示候选红圈（多个候选 + 当前激活一个高亮放大）
        if (this.mode === 'local' && this.aiCandidates.length > 0) {
          const key = `${row}-${col}`;
          const candIdx = this.aiCandidates.indexOf(key);
          if (candIdx > -1) {
            const cv = document.createElement('div');
            const active = (candIdx === this.aiCandidatesActiveIdx);
            cv.className = 'think-candidate ' + (active ? 'active' : 'dim');
            el.appendChild(cv);
          }
        }
      }
    });

    // 高亮赢线（仍保留，用户没说去掉赢线高亮）
    const winLine = this.state.winLine;
    document.querySelectorAll('.cell').forEach((el) => el.classList.remove('win'));
    if (winLine && this.state.status === 'ended') {
      for (const [r, c] of winLine) {
        const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        if (cell) cell.classList.add('win');
      }
    }

    // 棋盘禁用态（AI 思考 / 对局结束）
    const humanPlayer = (this.playerSide === 'white') ? WHITE : BLACK;
    if (this.state.status === 'ended') {
      this.setBoardDisabled(true);
    } else if (this.mode === 'local') {
      this.setBoardDisabled(!!this.aiTimer || this.state.current !== humanPlayer);
    }

    this.renderTurnIndicator();

    // 结束显示：横幅按钮区 + 联机投票条
    if (this.state.status === 'ended') {
      this.renderEndBanner();
      if (this.mode === 'online') this.renderRematchBar();
      else this.hideRematchBar();
    } else {
      this.hideEndBanner();
      if (this.mode === 'local') {
        this.hideRematchBar();
      } else if (this.rematch.status === 'none') {
        this.hideRematchBar();
      }
    }

    if (this.mode === 'online') this.updateRoomUI({});
  },

  renderTurnIndicator() {
    const el = safeGet('turn-indicator');
    if (!el || !this.state) return;
    const cur = this.state.current;
    let label = '';
    let dotHtml = '';

    if (this.state.status === 'ended') {
      // 胜利归属由 winner 决定 — 白 / 黑 / 平局
      const w = this.state.winner;
      if (w === 0) label = '平局';
      else if (w === WHITE) label = '白方胜利！ 🎉';
      else label = '黑方胜利！';
    } else if (this.mode === 'local') {
      const humanPlayer = (this.playerSide === 'white') ? WHITE : BLACK;
      const aiPlayer    = (this.playerSide === 'white') ? BLACK : WHITE;
      const sideHint = mySideLabel(this.playerSide);
      if (cur === humanPlayer) {
        label = `${sideHint} · 你的回合`;
      } else {
        // AI 思考中 — 显示提示小点；候选循环阶段仍用同文案
        label = `${sideHint} · AI 思考中`;
        dotHtml = '<span class="thinking-dot" aria-hidden="true"></span>';
      }
    } else if (this.mode === 'online') {
      label = cur === this.mySeat ? '你的回合' : '对方回合';
      if (cur !== this.mySeat) dotHtml = '<span class="thinking-dot" aria-hidden="true"></span>';
    } else {
      label = cur === WHITE ? '白方回合' : '黑方回合';
    }
    el.innerHTML = label + dotHtml;
    // 颜色：本地/联机都根据 cur 选用白色类或黑色类（white/black），ended 保持中性 white
    if (this.state.status === 'ended') el.className = 'white';
    else if (this.mode === 'local') el.className = (cur === WHITE) ? 'white' : 'black';
    else el.className = (cur === this.mySeat) ? 'white' : 'black';
  },

  renderEndBanner() {
    if (!this.state) return;
    const winner = this.state.winner;
    let cls = '';
    // 根据本地玩家相对视角分 win/lose 颜色（但 banner.title 现在不显示胜负）
    if (this.mode === 'local') {
      if (winner === 0) cls = 'draw';
      else {
        const humanPlayer = (this.playerSide === 'white') ? WHITE : BLACK;
        cls = (winner === humanPlayer) ? 'win' : 'lose';
      }
      const again = safeGet('btn-end-again');
      if (again) { again.style.display = ''; again.textContent = '再来一局'; again.disabled = false; }
      this.showEndBanner('', cls);
      return;
    }
    // online
    if (winner === 0) cls = 'draw';
    else cls = (winner === this.mySeat) ? 'win' : 'lose';
    const again = safeGet('btn-end-again');
    if (again) {
      if (this.mySeat === 1) {
        again.style.display = '';
        again.textContent = (this.rematch.status === 'pending') ? '撤回重开请求' : '请求再来一局';
        again.disabled = false;
      } else {
        again.style.display = 'none';
      }
    }
    this.showEndBanner('', cls);
  },

  _gemSVG(player) {
    // P1 = 先手 · 粉白（粉+珠光白+青蓝边，原神月亮棋白棋色）
    // P2 = 后手 · 紫蓝（皇家蓝 + 紫罗兰，原神月亮棋黑棋色）
    if (player === WHITE) {
      return `<svg viewBox="0 0 100 100" class="gem"><defs>
        <radialGradient id="gw" cx="48%" cy="36%" r="68%">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="32%"  stop-color="#fff5fb" stop-opacity="0.98"/>
          <stop offset="58%"  stop-color="#ffc3de" stop-opacity="0.96"/>
          <stop offset="82%"  stop-color="#ff8fc7" stop-opacity="0.94"/>
          <stop offset="100%" stop-color="#c97bff" stop-opacity="0.9"/>
        </radialGradient>
        <linearGradient id="gws" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#b6efff" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#ffa4d6" stop-opacity="0.1"/>
        </linearGradient>
        <filter id="glw"><feGaussianBlur stdDeviation="2.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" fill="url(#gw)" filter="url(#glw)" stroke="#ffd8ec" stroke-opacity="0.78" stroke-width="1.2"/>
      <!-- 左上青蓝粉 facet -->
      <polygon points="12,30 30,30 14,52 12,30" fill="url(#gws)"/>
      <polygon points="30,30 50,8 50,50 30,70 14,52 30,30" fill="#c4f3ff" fill-opacity="0.14"/>
      <!-- 顶部高光 -->
      <polygon points="50,8 70,30 50,44 30,30" fill="#ffffff" fill-opacity="0.52"/>
      <!-- 右下粉 facet -->
      <polygon points="88,30 88,70 70,50 70,30" fill="#ff6fb8" fill-opacity="0.18"/>
      <polygon points="50,92 30,70 50,54 70,70 88,70 50,92" fill="#b87aff" fill-opacity="0.18"/>
      <!-- 中央闪耀点 -->
      <circle cx="46" cy="40" r="3.4" fill="#ffffff" fill-opacity="0.92"/>
    </svg>`;
    } else {
      return `<svg viewBox="0 0 100 100" class="gem"><defs>
        <radialGradient id="gb" cx="50%" cy="34%" r="70%">
          <stop offset="0%"   stop-color="#e9efff" stop-opacity="1"/>
          <stop offset="30%"  stop-color="#8fb3ff" stop-opacity="0.98"/>
          <stop offset="58%"  stop-color="#7a5bff" stop-opacity="0.97"/>
          <stop offset="84%"  stop-color="#4a2bc7" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#241070" stop-opacity="0.92"/>
        </radialGradient>
        <linearGradient id="gbs" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#7e6bff" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#3b6fff" stop-opacity="0.28"/>
        </linearGradient>
        <filter id="glb"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" fill="url(#gb)" filter="url(#glb)" stroke="#c0b8ff" stroke-opacity="0.72" stroke-width="1.2"/>
      <!-- 左紫 facet + 右蓝 facet 斜切 -->
      <polygon points="12,30 30,30 14,52 12,30" fill="#9e7cff" fill-opacity="0.28"/>
      <polygon points="30,30 50,8 50,50 30,70 14,52 30,30" fill="url(#gbs)"/>
      <!-- 顶部高光 -->
      <polygon points="50,8 70,30 50,44 30,30" fill="#d7e6ff" fill-opacity="0.38"/>
      <!-- 右下紫+蓝混合 facet -->
      <polygon points="88,30 88,70 68,50 70,30" fill="#3a6bff" fill-opacity="0.24"/>
      <polygon points="50,92 30,70 50,54 70,70 88,70 50,92" fill="#6b3cff" fill-opacity="0.2"/>
      <!-- 中央闪耀点 -->
      <circle cx="46" cy="40" r="3" fill="#e9f2ff" fill-opacity="0.9"/>
    </svg>`;
    }
  },
};

function safeGet(id) {
  const el = document.getElementById(id);
  return el || null;
}

document.addEventListener('DOMContentLoaded', () => App.init());

  </script>
</body>
</html>
